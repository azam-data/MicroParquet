[package]
name = "micro_parquet"
version = "1.6.0"
edition = "2021"
description = "Ultra-Low-RAM Portable CSV/Parquet Workstation & Banking Analytics Engine"

[[bin]]
name = "MicroParquet"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["default"] }
egui_plot = "0.29"
rfd = "0.15"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
getrandom = "0.2"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
rust_xlsxwriter = "0.79"
printpdf = "0.7"
egui-phosphor = "0.7"

[dependencies.polars]
version = "0.43"
features = [
    "lazy",
    "streaming",
    "csv",
    "parquet",
    "strings",
    "regex",
    "temporal",
    "dtype-date",
    "dtype-datetime",
    "fmt",
    "sql",
    "asof_join",
    "semi_anti_join",
    "partition_by",
    "log",
    "round_series",
    "is_in",
    "concat_str",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
