name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    env:
      # Debug builds of Polars test binaries are about 1.5 GB each; without debug info and
      # incremental data the job fits on the runner's disk (the linker died with a bus error).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The PDF page checks of Phase 8 (W11) read the pages with pdftotext; without it they are skipped.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get install -y poppler-utils
      - name: cargo test
        run: cargo test

  actionlint:
    name: actionlint (workflow files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
