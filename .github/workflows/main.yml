name: Build & Release MicroParquet (Windows & macOS M4 .app)

on:
  workflow_dispatch: # Allows manual 1-click build in the GitHub Actions tab
    inputs:
      platforms:
        description: 'Which platforms to build (a pushed v* tag always builds both)'
        type: choice
        options:
          - windows
          - macos
          - both
        default: windows
  push:
    tags:
      - 'v*'         # Automatically publishes a GitHub Release when you push a tag like v1.1.0

permissions:
  contents: write

jobs:
  plan:
    name: Choose the platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the build matrix
        id: pick
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'both' }}
        run: |
          WIN='{"os_name":"Windows-x64-Portable","runner":"windows-latest","target":"x86_64-pc-windows-msvc","bin_name":"MicroParquet.exe","archive_name":"MicroParquet-Windows-x64-Portable.zip"}'
          MAC='{"os_name":"macOS-Apple-Silicon-M4-App","runner":"macos-latest","target":"aarch64-apple-darwin","bin_name":"MicroParquet","archive_name":"MicroParquet-macOS-AppleSilicon-App.zip"}'
          case "$PLATFORMS" in
            windows) LIST="$WIN" ;;
            macos) LIST="$MAC" ;;
            both) LIST="$WIN,$MAC" ;;
            *) echo "Unknown platforms '$PLATFORMS'. Use windows, macos or both."; exit 1 ;;
          esac
          echo "matrix={\"include\":[$LIST]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os_name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: 3. Cache Cargo & Polars Dependencies
        uses: Swatinem/rust-cache@v2

      - name: 3c. Clippy (informational, not blocking)
        continue-on-error: true
        run: cargo clippy --target ${{ matrix.target }}

      - name: 4. Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: 5. Package Portable Archive (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/portable_data/macros"
          New-Item -ItemType Directory -Force -Path "dist/portable_data/schemas"
          New-Item -ItemType Directory -Force -Path "dist/portable_data/curves"
          New-Item -ItemType Directory -Force -Path "dist/portable_data/temp_scratch"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: 5. Package macOS .app Bundle (Apple Silicon M4)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          APP_DIR="dist/MicroParquet.app"
          # portable_data is created next to the .app (or in ~/Library/Application Support/MicroParquet
          # when that folder is read-only) on first run; nothing is packed inside the bundle.
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${APP_DIR}/Contents/MacOS/MicroParquet"
          chmod +x "${APP_DIR}/Contents/MacOS/MicroParquet"

          cat > "${APP_DIR}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MicroParquet</string>
              <key>CFBundleIdentifier</key>
              <string>com.azamdata.microparquet</string>
              <key>CFBundleName</key>
              <string>MicroParquet</string>
              <key>CFBundleDisplayName</key>
              <string>MicroParquet</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign the bundle and use ditto so macOS permissions & bundle attributes survive zipping
          codesign --force --deep --sign - "${APP_DIR}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${{ matrix.archive_name }}"

      - name: 6. Upload Build Artifact (Downloadable from Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}
          path: ${{ matrix.archive_name }}

      - name: 7. Publish to GitHub Releases (When triggered by a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
