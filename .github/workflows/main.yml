name: Build & Release MicroParquet (Windows & macOS M4)

on:
  workflow_dispatch: # Allows manual 1-click build in GitHub Actions tab
  push:
    tags:
      - 'v*'         # Automatically creates a GitHub Release when you push a tag like v1.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows-x64-Portable
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: MicroParquet.exe
            archive_name: MicroParquet-Windows-x64-Portable.zip

          - os_name: macOS-Apple-Silicon-M4
            runner: macos-14 # Native Apple Silicon ARM64 runner
            target: aarch64-apple-darwin
            bin_name: MicroParquet
            archive_name: MicroParquet-macOS-AppleSilicon.zip

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 3. Cache Cargo & Polars Dependencies (Speeds up future builds by 80%)
        uses: Swatinem/rust-cache@v2

      - name: 4. Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: 5. Package Portable Archive (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          mkdir dist/portable_data
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.archive_name }}"

      - name: 5. Package Portable Archive (macOS Apple Silicon)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/portable_data
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/
          chmod +x "dist/${{ matrix.bin_name }}"
          cd dist && zip -r "../${{ matrix.archive_name }}" .

      - name: 6. Upload Build Artifact (Downloadable from Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}
          path: ${{ matrix.archive_name }}

      - name: 7. Publish to GitHub Releases (When triggered by a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
